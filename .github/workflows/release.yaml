name: Release

on:
  workflow_dispatch:
    inputs:
      release-notes:
        description: Optional intro above the generated release notes
        type: string
        required: false

permissions: {}

concurrency:
  group: npm-staged-release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: luxass/shared-workflows/.github/workflows/reusable-release-npm-staged.yaml@10298e06aecc428b39ef4121636400396b53a1fa # v0.16.0
    with:
      release-notes: ${{ inputs.release-notes }}
