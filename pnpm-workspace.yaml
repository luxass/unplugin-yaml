ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true
packages:
  - examples/**

minimumReleaseAgeExclude:
  - "@luxass/utils@2.7.5"
  # Renovate security update: pnpm@11.8.0
  - pnpm@11.8.0

catalogs:
  dev:
    "@luxass/utils": 2.7.5
    "@nuxt/kit": 4.6.1
    "@nuxt/schema": 4.6.1
    "@rspack/core": 2.2.8
    "@types/node": 26.6.5
    astro: 7.3.8
    esbuild: 0.28.2
    oxfmt: 0.72.0
    oxlint: 1.87.0
    oxlint-tsgolint: 7.0.2004
    publint: 0.3.25
    rolldown: 1.2.13
    rollup: 4.64.5
    tsdown: 0.23.1
    typescript: 7.0.2
    vite: 8.3.5
    vitest: 5.0.3
    vitest-testdirs: 4.5.1
    webpack: 5.111.1

  example:
    "@rspack/cli": 2.2.8
    "@rspack/dev-server": 2.2.1

  runtime:
    "@rollup/pluginutils": 5.4.0
    unplugin: 3.4.0
    yaml: 2.9.1

onlyBuiltDependencies:
  - esbuild
