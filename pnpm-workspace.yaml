ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true
packages:
  - examples/**

minimumReleaseAgeExclude:
  - "@luxass/utils@2.7.5"
  # Renovate security update: pnpm@11.8.0
  - pnpm@11.8.0

catalogs:
  dev:
    "@luxass/utils": 2.7.5
    "@nuxt/kit": 4.5.2
    "@nuxt/schema": 4.5.2
    "@rspack/core": 2.2.4
    "@types/node": 26.5.1
    astro: 7.3.2
    esbuild: 0.28.2
    oxfmt: 0.68.0
    oxlint: 1.83.0
    oxlint-tsgolint: 7.0.2001
    publint: 0.3.24
    rolldown: 1.2.8
    rollup: 4.63.3
    tsdown: 0.23.0
    typescript: 7.0.2
    vite: 8.3.0
    vitest: 5.0.0
    vitest-testdirs: 4.4.3
    webpack: 5.111.0

  example:
    "@rspack/cli": 2.2.4
    "@rspack/dev-server": 2.2.1

  runtime:
    "@rollup/pluginutils": 5.4.0
    unplugin: 3.3.0
    yaml: 2.9.1

onlyBuiltDependencies:
  - esbuild
