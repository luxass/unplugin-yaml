ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true
packages:
  - examples/**

minimumReleaseAgeExclude:
  - "@luxass/utils@2.7.5"
  # Renovate security update: pnpm@11.8.0
  - pnpm@11.8.0

catalogs:
  dev:
    "@luxass/utils": 2.7.5
    "@nuxt/kit": 4.6.4
    "@nuxt/schema": 4.6.1
    "@rspack/core": 2.3.1
    "@types/node": 26.6.6
    astro: 7.3.8
    esbuild: 0.28.2
    oxfmt: 0.72.0
    oxlint: 1.87.0
    oxlint-tsgolint: 7.0.2006
    publint: 0.3.25
    rolldown: 1.3.0
    rollup: 4.68.0
    tsdown: 0.23.7
    typescript: 7.0.2
    vite: 8.3.4
    vitest: 5.0.3
    vitest-testdirs: 4.5.2
    webpack: 5.112.2

  example:
    "@rspack/cli": 2.3.1
    "@rspack/dev-server": 2.2.2

  runtime:
    "@rollup/pluginutils": 5.5.1
    unplugin: 3.7.0
    yaml: 2.9.1

onlyBuiltDependencies:
  - esbuild
